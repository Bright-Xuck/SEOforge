<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Example Website</title>
    <meta name="description" content="A sample website for testing Forge's HTML parser." />
    <link rel="canonical" href="https://example.com/" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles/main.css" />
    <style>
      body {
        margin: 0;
      }
    </style>
    <meta property="og:title" content="Example Website" />
    <meta property="og:description" content="Open Graph description" />
    <meta property="og:image" content="https://example.com/og.png" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Example" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Example Website" />
    <meta name="twitter:description" content="Twitter description" />
    <meta name="twitter:image" content="https://example.com/twitter.png" />
    <meta name="twitter:site" content="@example" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Example",
        "url": "https://example.com/"
      }
    </script>
    <script src="https://example.com/vendor.js" type="text/javascript"></script>
  </head>
  <body>
    <h1>Main Heading</h1>
    <h2>Section One</h2>
    <p>Some content with a <a href="/about">link to about</a> page.</p>
    <h2>Section Two</h2>
    <p>External reference: <a href="https://external.com">visit</a>.</p>
    <h3>Subsection</h3>
    <img src="/images/logo.png" alt="Company Logo" />
    <img src="https://cdn.example.com/banner.jpg" alt="" />
    <a href="#anchor">Skip link</a>
  </body>
</html>
